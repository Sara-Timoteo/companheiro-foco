name: companheiro-foco

# Hardening applied to every service: non-root, read-only FS, no Linux capabilities.
x-hardening: &hardening
  user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  restart: unless-stopped
  networks: [focus-net]

services:
  mosquitto:
    <<: *hardening
    image: eclipse-mosquitto:2
    container_name: focus-mosquitto
    ports:
      - "127.0.0.1:8883:8883"                       # localhost only
    volumes:
      - ./mosquitto/config:/mosquitto/config:ro
      - ./certs/out/ca.crt:/mosquitto/certs/ca.crt:ro
      - ./certs/out/server.crt:/mosquitto/certs/server.crt:ro
      - ./certs/out/server.key:/mosquitto/certs/server.key:ro

  sensor:
    <<: *hardening
    build: ./sensor
    container_name: focus-sensor
    depends_on: [mosquitto]
    environment:
      MQTT_HOST: mosquitto
      MQTT_PORT: "8883"
      TIME_SCALE: "${TIME_SCALE:-1}"                 # >1 only for demos
    volumes:                                         # only its own identity
      - ./certs/out/ca.crt:/certs/ca.crt:ro
      - ./certs/out/sensor.crt:/certs/client.crt:ro
      - ./certs/out/sensor.key:/certs/client.key:ro

networks:
  focus-net:
    name: focus-net
