# Focus Companion broker: mutual TLS only, no plaintext listener.
allow_anonymous false

listener 8883
cafile   /mosquitto/certs/ca.crt
certfile /mosquitto/certs/server.crt
keyfile  /mosquitto/certs/server.key
require_certificate true
# The client certificate CN becomes the MQTT username (used by the ACL).
use_identity_as_username true

acl_file /mosquitto/config/acl

# Privacy: nothing is stored on disk.
persistence false
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
